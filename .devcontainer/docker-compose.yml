name: dev-benches

services:
  cpp-bench:
    env_file: .env
    image: cpp-bench:${USER:-brett}
    container_name: cpp-bench
    command: ["/bin/bash", "-c", 'sudo install -d -m 0700 -o "$$(id -u)" -g "$$(id -g)" "$$HOME/.workbenches-history" && if [ -f "$$HOME/.workbenches-history/.zsh_history" ]; then sudo chown "$$(id -u):$$(id -g)" "$$HOME/.workbenches-history/.zsh_history"; fi && exec sleep infinity']
    volumes:
      - cppbench-zshhistory:/home/${USER:-brett}/.workbenches-history
    working_dir: /workspace
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      core: -1
    environment:
      - HISTFILE=/home/${USER:-brett}/.workbenches-history/.zsh_history
      - VCPKG_ROOT=/opt/vcpkg
      - CC=/usr/bin/gcc-12
      - CXX=/usr/bin/g++-12
    networks:
      - cpp-bench-net

volumes:
  cppbench-zshhistory:

networks:
  cpp-bench-net:
    driver_opts:
      com.docker.network.driver.mtu: "1400"
